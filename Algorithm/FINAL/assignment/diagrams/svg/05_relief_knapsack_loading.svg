  <rect class="item chosen" x="115" y="255" width="290" height="75"/><text class="head" x="140" y="286">Water</text><text class="small" x="140" y="315">W4, V12</text>
  <rect class="item rejected" x="115" y="355" width="290" height="75"/><text class="head" x="140" y="386">Blankets</text><text class="small" x="140" y="415">W5, V8</text>
  <rect class="item chosen" x="115" y="455" width="290" height="75"/><text class="head" x="140" y="486">Dry Food</text><text class="small" x="140" y="515">W3, V9</text>
  <rect class="item rejected" x="115" y="555" width="290" height="75"/><text class="head" x="140" y="586">Tools</text><text class="small" x="140" y="615">W6, V11</text>
  <path class="arrow" d="M465 355 H565"/>
  <rect class="panel" x="565" y="125" width="260" height="455"/><text class="head" x="600" y="175">Best Value</text><text class="head" x="600" y="250">31</text><text class="small" x="600" y="295">Capacity: 9</text><text class="small" x="600" y="340">Medicine</text><text class="small" x="600" y="378">Water</text><text class="small" x="600" y="416">Dry Food</text>
  <path class="arrow" d="M825 355 H945"/>
  <rect class="panel" x="945" y="115" width="365" height="485"/><text class="head" x="990" y="165">Vehicle Load</text><text class="small" x="990" y="205">Selected items only</text>
