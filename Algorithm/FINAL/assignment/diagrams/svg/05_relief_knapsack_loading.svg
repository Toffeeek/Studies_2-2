<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <defs><style>.bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:3;rx:8}.head{font:700 28px Arial,sans-serif;fill:#0f172a}.small{font:400 23px Arial,sans-serif;fill:#334155}.tiny{font:700 18px Arial,sans-serif;fill:#052e16}.item{fill:#eef6ff;stroke:#60a5fa;stroke-width:3;rx:8}.chosen{fill:#dcfce7;stroke:#16a34a}.rejected{fill:#fee2e2;stroke:#ef4444}.truck{fill:#e2e8f0;stroke:#334155;stroke-width:5}.load{fill:#22c55e}.empty{fill:#fff;stroke:#94a3b8;stroke-width:3}.arrow{stroke:#334155;stroke-width:4;fill:none;marker-end:url(#arrow)}</style><marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M2,2 L12,7 L2,12 Z" fill="#334155"/></marker></defs>
  <rect class="bg" width="1400" height="760"/>
  <rect class="panel" x="75" y="70" width="390" height="575"/><text class="head" x="110" y="120">Relief Items</text>
