<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <defs>
    <style>.bg{fill:#f8fafc}.box{fill:#fff;stroke:#cbd5e1;stroke-width:3;rx:8}.input{fill:#eef6ff;stroke:#60a5fa}.process{fill:#f8fff3;stroke:#84cc16}.output{fill:#fff7ed;stroke:#fb923c}.risk{fill:#fff1f2;stroke:#fb7185}.label{font:700 30px Arial,sans-serif;fill:#0f172a}.small{font:400 24px Arial,sans-serif;fill:#334155}.chip{fill:#e2e8f0}.chipText{font:700 20px Arial,sans-serif;fill:#334155}.arrow{stroke:#334155;stroke-width:4;fill:none;marker-end:url(#arrow)}</style>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M2,2 L12,7 L2,12 Z" fill="#334155"/></marker>
  </defs>
  <rect class="bg" width="1400" height="760"/>
  <rect class="box input" x="55" y="130" width="270" height="140"/><text class="label" x="88" y="178">Live Inputs</text><text class="small" x="88" y="218">Road graph</text><text class="small" x="88" y="250">Flood reports</text>
  <rect class="box input" x="55" y="365" width="270" height="140"/><text class="label" x="88" y="413">Resources</text><text class="small" x="88" y="453">Shelters</text><text class="small" x="88" y="485">Vehicles</text>
  <rect class="box risk" x="395" y="70" width="285" height="130"/><text class="label" x="430" y="122">Reachability</text><text class="small" x="430" y="158">Open roads only</text><rect class="chip" x="430" y="170" width="115" height="34" rx="7"/><text class="chipText" x="449" y="195">BFS/DFS</text>
  <rect class="box process" x="395" y="250" width="285" height="130"/><text class="label" x="430" y="302">Priority</text><text class="small" x="430" y="338">Urgent zones first</text><rect class="chip" x="430" y="350" width="90" height="34" rx="7"/><text class="chipText" x="449" y="375">Sort</text>
  <rect class="box process" x="395" y="430" width="285" height="130"/><text class="label" x="430" y="482">Flood Area</text><text class="small" x="430" y="518">Danger boundary</text><rect class="chip" x="430" y="530" width="148" height="34" rx="7"/><text class="chipText" x="449" y="555">Convex Hull</text>
  <rect class="box process" x="760" y="70" width="285" height="130"/><text class="label" x="795" y="122">Safe Routes</text><text class="small" x="795" y="158">Distance + risk</text><rect class="chip" x="795" y="170" width="110" height="34" rx="7"/><text class="chipText" x="814" y="195">Dijkstra</text>
  <rect class="box process" x="760" y="250" width="285" height="130"/><text class="label" x="795" y="302">All Pairs</text><text class="small" x="795" y="338">Key locations</text><rect class="chip" x="795" y="350" width="180" height="34" rx="7"/><text class="chipText" x="814" y="375">Floyd-Warshall</text>
  <rect class="box process" x="760" y="430" width="285" height="130"/><text class="label" x="795" y="482">Relief Load</text><text class="small" x="795" y="518">Best supplies</text><rect class="chip" x="795" y="530" width="135" height="34" rx="7"/><text class="chipText" x="814" y="555">Knapsack</text>
  <rect class="box process" x="760" y="610" width="285" height="105"/><text class="label" x="795" y="655">Temp Links</text><rect class="chip" x="795" y="670" width="78" height="34" rx="7"/><text class="chipText" x="814" y="695">MST</text>
  <rect class="box output" x="1120" y="115" width="225" height="110"/><text class="label" x="1150" y="165">Evacuation</text><text class="small" x="1150" y="198">Routes</text>
  <rect class="box output" x="1120" y="320" width="225" height="110"/><text class="label" x="1150" y="370">Relief</text><text class="small" x="1150" y="403">Deliveries</text>
  <rect class="box output" x="1120" y="525" width="225" height="110"/><text class="label" x="1150" y="575">Risk Map</text><text class="small" x="1150" y="608">Closures</text>
  <path class="arrow" d="M325 200 H395"/><path class="arrow" d="M325 435 H395"/><path class="arrow" d="M680 135 H760"/><path class="arrow" d="M680 315 H760"/><path class="arrow" d="M680 495 H760"/><path class="arrow" d="M1045 135 H1120"/><path class="arrow" d="M1045 315 C1080 315 1085 170 1120 170"/><path class="arrow" d="M1045 495 C1080 495 1085 375 1120 375"/><path class="arrow" d="M1045 662 C1080 662 1085 580 1120 580"/>
